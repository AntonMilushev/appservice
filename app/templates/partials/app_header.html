<header class="app-topbar">
    <div class="app-topbar__inner">
        <a class="app-topbar__brand" href="{{ brand_href|default('/') }}">
            <span class="app-topbar__mark">PA</span>
            <span class="app-topbar__brand-text">Provider App</span>
        </a>

        <div class="app-topbar__title">
            {% if page_label %}<span class="app-topbar__eyebrow">{{ page_label }}</span>{% endif %}
            {% if page_title %}<span class="app-topbar__page-title">{{ page_title }}</span>{% endif %}
        </div>

        <div class="app-topbar__actions">
            {% block topbar_actions %}{% endblock %}
        </div>
    </div>
</header>
